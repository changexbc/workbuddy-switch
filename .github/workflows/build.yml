name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cli_bin: wb-switch-darwin-arm64
            platform_tag: darwin-arm64
            bundles: app
            update_arch: aarch64
          - name: mac-x64
            os: macos-14
            target: x86_64-apple-darwin
            cli_bin: wb-switch-darwin-x64
            platform_tag: darwin-x64
            bundles: app
            update_arch: x86_64
          - name: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_bin: wb-switch-win32-x64.exe
            platform_tag: win32-x64
            bundles: nsis
            update_arch: ''
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_bin: wb-switch-linux-x64
            platform_tag: linux-x64
            bundles: deb,appimage
            update_arch: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # cargo 缓存：依赖 + 编译产物，增量编译大幅提速（Cargo.lock 不变时命中）
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 前端构建产物（CLI 二进制 rust-embed 嵌入 + Tauri App 使用）
      - name: Build frontend
        run: |
          npm install
          npm run build

      # CLI 二进制
      - name: Build server binary
        shell: bash
        run: |
          cargo build -p wb-switch-server --release --target ${{ matrix.target }}
          mkdir -p dist-bin

      # 打包本平台包并发布到 npm（CLI 二进制走 npm registry，Release 只留桌面 App）
      - name: Publish platform package
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_DIR="npm/platform/workbuddy-switch-${{ matrix.platform_tag }}"
          # 用 tag 版本同步 platform 包版本（git 里的可能滞后）
          VER="${GITHUB_REF_NAME#v}"
          perl -pi -e "s/\"version\": \"[0-9.]+\"/\"version\": \"$VER\"/" "$PKG_DIR/package.json"
          mkdir -p "$PKG_DIR/bin"
          SRC="target/${{ matrix.target }}/release/wb-switch"
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          cp "$SRC" "$PKG_DIR/bin/${{ matrix.cli_bin }}"
          cd "$PKG_DIR"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public --registry=https://registry.npmjs.org

      # 桌面 App（mac app / nsis exe / deb + AppImage）
      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          find "target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} dist-bin/ \;
          # mac：纯命令行打 dmg（CI 无 Finder，Tauri 自带的 bundle_dmg.sh 会失败）
          if [ "${{ matrix.bundles }}" = "app" ]; then
            sh scripts/make-dmg.sh "${GITHUB_REF_NAME#v}" "${{ matrix.update_arch }}" "target/${{ matrix.target }}/release/bundle/macos/workbuddy-switch.app"
            cp "workbuddy-switch_${GITHUB_REF_NAME#v}_${{ matrix.update_arch }}.dmg" dist-bin/
          fi

      - name: Generate macOS updater manifest
        if: matrix.update_arch != ''
        shell: bash
        env:
          UPDATE_ARCH: ${{ matrix.update_arch }}
          UPDATE_ARCHIVE_NAME: workbuddy-switch-macos-${{ matrix.update_arch }}.app.tar.gz
        run: |
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/macos"
          ARCHIVE="$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          test -f "$ARCHIVE.sig"
          cp "$ARCHIVE" "dist-bin/$UPDATE_ARCHIVE_NAME"
          cp "$ARCHIVE.sig" "dist-bin/$UPDATE_ARCHIVE_NAME.sig"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle/macos" \
            sh scripts/gen-update-json.sh
          MANIFEST="$BUNDLE_DIR/latest-macos-${UPDATE_ARCH}.json"
          test -f "$MANIFEST"
          cp "$MANIFEST" dist-bin/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  # 所有平台包发布成功后，发布主包（optionalDependencies 引用平台包）
  publish-main:
    name: Publish npm main package
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish main package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd npm
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          npm publish --access public --registry=https://registry.npmjs.org

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
