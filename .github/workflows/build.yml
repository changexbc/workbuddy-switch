name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-arm64
            os: macos-14
            target: aarch64-apple-darwin
            cli_bin: wb-switch-darwin-arm64
            bundles: app
          - name: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            cli_bin: wb-switch-win32-x64.exe
            bundles: nsis
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cli_bin: wb-switch-linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 前端构建产物（CLI 二进制 rust-embed 嵌入 + Tauri App 使用）
      - name: Build frontend
        run: |
          npm install
          npm run build

      # CLI 二进制（npm workbuddy-switch 的 postinstall 下载）
      - name: Build server binary
        shell: bash
        run: |
          cargo build -p wb-switch-server --release --target ${{ matrix.target }}
          mkdir -p dist-bin
          SRC="target/${{ matrix.target }}/release/wb-switch"
          [ -f "$SRC.exe" ] && SRC="$SRC.exe"
          cp "$SRC" "dist-bin/${{ matrix.cli_bin }}"

      # 桌面 App（dmg / nsis exe / deb + AppImage）
      - name: Build desktop app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          find "target/${{ matrix.target }}/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' \
            -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} dist-bin/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist-bin/
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
