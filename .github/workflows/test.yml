name: test

# 测试必须独立于发布流程：build.yml 仅由 tag push / workflow_dispatch 触发，
# 测试若挂在它下面，就只在发版时执行——2026-09 的 Windows「os error 5」回归
# 正是这样漏到 0.1.43 的。本 workflow 在 push 与 PR 上即触发。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 三平台结果一次跑齐：任一平台失败不阻塞其余平台出结果。
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 build.yml 分开的 key 前缀（那边是 release profile 产物），
      # restore-keys 回落到它的缓存，以复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      # 只跑 core：零 tauri 依赖，不需要 webkit / npm / 前端 dist。
      # 不传 --target，用 runner 原生 target——build.yml 的 mac-x64 是 arm runner 上
      # 交叉编译 x86_64，跑测试需要 Rosetta，不适用于本 job。
      - name: Run tests
        run: cargo test -p wb-switch-core

      # linux 专属 cfg 分支只在 ubuntu 上展开（macOS 侧由 lint job 覆盖）。
      - name: Clippy (linux cfg)
        if: runner.os == 'Linux'
        run: cargo clippy -p wb-switch-core -p wb-switch-server --all-targets --no-deps -- -D warnings

  # 前端类型、格式与 lint 门禁。跑在 macOS 上：clippy 按宿主平台展开 cfg 分支，
  # 与开发者本机一致，本地全绿即 CI 全绿。linux 专属分支由 rust-tests 的 ubuntu
  # job 覆盖，windows 分支暂未纳入。
  # clippy 必须带 --no-deps：vendor/agent-companion 是 path 依赖快照，其告警不归本仓库。
  lint:
    name: lint (tsc + fmt + clippy + server tests)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 与 rust-tests 相同的 key 前缀，直接复用依赖编译产物。
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # tsc 顺带产出 dist：clippy 检查 src-tauri 时 tauri-build 要求 frontendDist 存在。
      - name: Type-check and build frontend
        run: npm run build

      # tauri-build 还要求 externalBin 存在。这里只放占位文件让编译检查通过；
      # 真实 runtime 由 build.yml（发版）与 scripts/prepare-agent-companion.mjs 产出。
      - name: Stub companion runtime binary
        run: |
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/agent-studio-runtime-$(rustc -vV | sed -n "s/^host: //p")"

      - name: Check formatting
        run: cargo fmt --check -p wb-switch-core -p wb-switch-server -p wb-switch-rust

      - name: Clippy
        run: cargo clippy -p wb-switch-core -p wb-switch-server -p wb-switch-rust --all-targets --no-deps -- -D warnings

      # server 的 8 个测试此前从不运行（rust-tests 只覆盖 core）。
      - name: Server tests
        run: cargo test -p wb-switch-server
