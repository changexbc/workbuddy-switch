<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>workbuddy-switch · Account switcher</title>
    <!--
      首屏兜底样式：纯内联，不引用任何外部资源（离线 / 资源加载失败时同样可见）。
      正常启动时 React 挂载会清空 #root，占位自然消失；主题跟随系统，避免深色下闪白。

      样式必须只落在 .wb-boot 上，不要写 body：这段内联样式是「未分层」的，
      而项目 CSS 走 Tailwind 的 @layer base，级联中未分层样式优先于所有分层样式。
      写到 body 上会盖掉应用自己的 body 颜色（--foreground），系统深色 + 应用浅色时
      所有未显式指定颜色的正文文字会继承成兜底用的近白色，看起来像文字消失。
    -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      .wb-boot {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px;
        text-align: center;
        background: #ffffff;
        color: #18181b;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", sans-serif;
      }
      .wb-boot-title {
        font-size: 15px;
        font-weight: 600;
      }
      .wb-boot-text {
        max-width: 460px;
        font-size: 12px;
        line-height: 1.7;
        color: #71717a;
      }
      .wb-boot-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 6px;
      }
      .wb-boot-button {
        padding: 7px 14px;
        border: 0;
        border-radius: 8px;
        background: #18181b;
        color: #fafafa;
        font-size: 13px;
        cursor: pointer;
      }
      .wb-boot-link {
        font-size: 12px;
        color: #71717a;
      }
      @media (prefers-color-scheme: dark) {
        .wb-boot {
          background: #18181b;
          color: #fafafa;
        }
        .wb-boot-button {
          background: #fafafa;
          color: #18181b;
        }
        .wb-boot-text,
        .wb-boot-link {
          color: #a1a1aa;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="wb-boot">
        <div class="wb-boot-title">Starting…</div>
        <div class="wb-boot-text">WorkBuddy account switcher</div>
      </div>
    </div>

    <!--
      The entry bundle localizes the interface. This inline script only covers the
      first paint and the 10 second fallback, so it carries its own copy of the few
      strings it needs. The storage key matches src/lib/i18n/locale.ts.
    -->
    <script>
      (function () {
        var timeoutMs = 10000;
        // 与 src/lib/update.ts 的 GITHUB_RELEASE_URL 一致（内联脚本不能引用打包产物）。
        var releaseUrl = "https://github.com/changexbc/workbuddy-switch/releases/latest";
        var text = {
          en: {
            starting: "Starting…",
            subtitle: "WorkBuddy account switcher",
            failedTitle: "The app failed to start",
            failedText:
              "The interface did not load. Try Reload first. If it keeps failing, update to the latest version from the tray menu.",
            reload: "Reload",
            download: "Download the latest version from GitHub",
          },
          ko: {
            starting: "시작하는 중…",
            subtitle: "WorkBuddy 계정 전환",
            failedTitle: "앱을 시작하지 못했습니다",
            failedText:
              "화면을 불러오지 못했습니다. 먼저 새로고침을 눌러 보세요. 계속 실패하면 트레이 메뉴에서 최신 버전으로 업데이트하세요.",
            reload: "새로고침",
            download: "GitHub에서 최신 버전 내려받기",
          },
        };

        var locale = "en";
        try {
          if (localStorage.getItem("wb-switch.locale") === "ko") locale = "ko";
        } catch (error) {
          // Storage unavailable: the default locale still renders.
        }
        var strings = text[locale];
        document.documentElement.lang = locale;

        var title = document.querySelector(".wb-boot-title");
        var subtitle = document.querySelector(".wb-boot-text");
        if (title) title.textContent = strings.starting;
        if (subtitle) subtitle.textContent = strings.subtitle;

        window.setTimeout(function () {
          if (window.__WB_MOUNTED__) return;
          var root = document.getElementById("root");
          if (!root) return;

          var wrap = document.createElement("div");
          wrap.className = "wb-boot";

          var failedTitle = document.createElement("div");
          failedTitle.className = "wb-boot-title";
          failedTitle.textContent = strings.failedTitle;

          var failedText = document.createElement("div");
          failedText.className = "wb-boot-text";
          failedText.textContent = strings.failedText;

          var actions = document.createElement("div");
          actions.className = "wb-boot-actions";

          var reload = document.createElement("button");
          reload.type = "button";
          reload.className = "wb-boot-button";
          reload.textContent = strings.reload;
          reload.addEventListener("click", function () {
            window.location.reload();
          });

          var link = document.createElement("a");
          link.className = "wb-boot-link";
          link.href = releaseUrl;
          link.target = "_blank";
          link.rel = "noreferrer noopener";
          link.textContent = strings.download;

          actions.appendChild(reload);
          actions.appendChild(link);
          wrap.appendChild(failedTitle);
          wrap.appendChild(failedText);
          wrap.appendChild(actions);

          root.textContent = "";
          root.appendChild(wrap);
        }, timeoutMs);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
