[package]
name = "agent-companion"
version = "0.1.0"
description = "Agent Companion desktop session assistant"
edition = "2021"

[features]
diagnostics = []
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-studio-desktop = { package = "tauri-plugin-agent-studio", path = "../crates/agent-studio-desktop", version = "0.1.0" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# The standalone binary owns application updates; embedded hosts keep their own.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSEvent", "NSApplication", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration"] }
