[package]
name = "agent-studio-core"
version = "0.1.0"
edition = "2021"
description = "Agent Studio local session monitoring core"
license = "MIT"
[dependencies]
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
base64 = "0.22"
fs2 = "0.4"
