[package]
name = "agent-studio-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared native Agent Studio collector and client"
[dependencies]
agent-studio-core = { path = "../agent-studio-core", version = "0.1.0" }
serde_json = "1"
url = "2"
ureq = { version = "2", default-features = false, features = ["json"] }
tiny_http = "0.12"
fs2 = "0.4"
uuid = { version = "1", features = ["v4"] }
