[package]
name = "wb-switch-server"
version = "0.1.15"
edition = "2021"
description = "wb-switch HTTP server + CLI（npm 安装形态：wb-switch 命令启动本地 webui）"

[[bin]]
name = "wb-switch"
path = "src/main.rs"

[dependencies]
wb-switch-core = { path = "../wb-switch-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde_json = "1"
rust-embed = "8"
